name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Run Pytest (SQLite)
        env:
          SECRET_KEY: test-secret-key-for-pytest-only-32bytes
          DATABASE_URL: sqlite:///:memory:
        run: |
          pytest --ignore=tests/test_postgres_integration.py
          
      - name: Run Pytest (PostgreSQL Integration)
        env:
          SECRET_KEY: test-secret-key-for-pytest-only-32bytes
          DATABASE_URL: sqlite:///:memory:
          TEST_DATABASE_URL: postgresql://testuser:testpassword@localhost:5432/testdb
        run: |
          pytest tests/test_postgres_integration.py
